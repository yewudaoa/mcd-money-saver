<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门省钱助手 · 后台管理</title>
<style>
  :root { --mred:#da291c; --myellow:#ffc72c; --ink:#1a1a1a; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Microsoft YaHei",system-ui,sans-serif; }
  body { background:#f2ede6; color:var(--ink); padding:20px 16px; }
  header { text-align:center; margin-bottom:16px; }
  header h1 { font-size:22px; } header h1 span { color:var(--mred); }
  header a { font-size:13px; color:#666; }
  .shell { max-width:960px; margin:0 auto; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:8px 18px; border-radius:999px; border:1.5px solid #ddd; background:#fff; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--mred); color:#fff; border-color:var(--mred); }
  .pane { display:none; background:#fff; border-radius:14px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .pane.active { display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px 6px; border-bottom:1px solid #f0eae0; text-align:left; vertical-align:middle; }
  th { color:#999; font-weight:600; }
  button { border:1px solid #ddd; background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; font-size:12px; margin:1px; }
  button:hover { border-color:var(--mred); color:var(--mred); }
  button.danger { color:#c22; }
  .tag { border-radius:999px; padding:2px 10px; font-size:11px; }
  .tag.on { background:#e8f7ec; color:#188a42; }
  .tag.off { background:#eee; color:#999; }
  .tag.type { background:#fff6da; color:#a07b00; }
  .thumb { display:inline-flex; width:40px; height:40px; border-radius:10px; align-items:center; justify-content:center; font-size:22px; }
  form.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:14px 0 18px; padding:14px; background:#faf7f2; border-radius:12px; border:1px dashed #e0d6c4; }
  form label { font-size:12px; color:#777; display:block; margin-bottom:3px; }
  form input, form select { width:100%; padding:7px 9px; border:1.5px solid #e5ddd0; border-radius:8px; font-size:13px; }
  form .full { grid-column:1 / -1; }
  .chk { display:inline-flex; align-items:center; gap:4px; margin:2px 10px 2px 0; font-size:13px; }
  h3 { font-size:14px; margin:14px 0 8px; border-left:4px solid var(--myellow); padding-left:8px; }
  .reset { float:right; margin-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1>🛠️ 麦门<span>省钱助手</span> · 后台管理</h1>
  <a href="index.html">← 返回前台比价 Demo</a>
</header>

<div class="shell">
  <div class="tabs">
    <div class="tab active" data-pane="paneProd">📦 商品管理</div>
    <div class="tab" data-pane="paneCp">🎫 优惠券 / 红包</div>
    <div class="tab" data-pane="panePm">⏰ 打折活动</div>
  </div>

  <!-- 商品管理 -->
  <div class="pane active" id="paneProd">
    <h3 id="prodFormTitle">新增商品</h3>
    <form id="prodForm" class="grid">
      <div><label>商品名称</label><input id="pName" required placeholder="如：巨无霸套餐"></div>
      <div><label>图片 Emoji</label><input id="pEmoji" placeholder="🍔"></div>
      <div><label>上传图片（可选，覆盖 Emoji）</label><input id="pImg" type="file" accept="image/*"></div>
      <div id="pImgPreviewBox" style="display:none"><label>图片预览 <a href="javascript:void(0)" id="pImgClear" style="color:var(--mred)">移除图片</a></label><img id="pImgPreview" style="width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid #eee"></div>
      <div><label>售价（元）</label><input id="pPrice" type="number" step="0.1" required placeholder="46.5"></div>
      <div><label>优惠价（可空）</label><input id="pPromo" type="number" step="0.1" placeholder="39.9"></div>
      <div><label>优惠叠加</label><select id="pStack"><option value="1">可参与打折活动</option><option value="0">不可叠加（不参与活动）</option></select></div>
      <div><label>图片渐变色①</label><input id="pGrad1" type="color" value="#ffd86b"></div>
      <div><label>图片渐变色②</label><input id="pGrad2" type="color" value="#ff9d3c"></div>
      <div class="full"><button type="submit" style="background:var(--mred);color:#fff;border:none;padding:8px 22px;border-radius:8px">保存商品</button></div>
    </form>
    <table>
      <thead><tr><th>图片</th><th>名称</th><th>价格</th><th>叠加</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="prodBody"></tbody>
    </table>
  </div>

  <!-- 优惠券/红包 -->
  <div class="pane" id="paneCp">
    <h3 id="cpFormTitle">新增券 / 红包</h3>
    <form id="cpForm" class="grid">
      <div><label>名称</label><input id="cName" required placeholder="如：新人红包"></div>
      <div><label>类型</label>
        <select id="cType">
          <option value="cut">满减券</option>
          <option value="red">红包（立抵）</option>
          <option value="pct">折扣券</option>
          <option value="bogo">买一送一</option>
          <option value="half2">第二份半价</option>
        </select>
      </div>
      <div><label>金额 / 折扣</label><input id="cValue" placeholder="5"></div>
      <div><label>使用门槛（元，0 无门槛）</label><input id="cMin" type="number" value="0"></div>
      <div><label>叠加规则</label><select id="cStack"><option value="1">可与活动/优惠叠加</option><option value="0">不可叠加（不与活动同享）</option></select></div>
      <div class="full" id="cpApplyBox"><label>适用商品（买一送一/第二份半价需指定）</label><div id="cpApply"></div></div>
      <div class="full"><button type="submit" style="background:var(--mred);color:#fff;border:none;padding:8px 22px;border-radius:8px">保存券</button></div>
    </form>
    <table>
      <thead><tr><th>名称</th><th>类型</th><th>规则</th><th>适用</th><th>叠加</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="cpBody"></tbody>
    </table>
  </div>

  <!-- 打折活动 -->
  <div class="pane" id="panePm">
    <h3 id="pmFormTitle">新增打折活动</h3>
    <form id="pmForm" class="grid">
      <div><label>活动名称</label><input id="aName" required placeholder="如：程序员节特惠"></div>
      <div><label>折扣（0.88 = 88折）</label><input id="aPct" type="number" step="0.01" min="0.1" max="1" required placeholder="0.88"></div>
      <div><label>叠加规则</label><select id="aStack"><option value="1">可与券叠加</option><option value="0">不可叠加（不与券同享）</option></select></div>
      <div class="full"><label>参与商品</label><div id="pmApply"></div></div>
      <div class="full"><button type="submit" style="background:var(--mred);color:#fff;border:none;padding:8px 22px;border-radius:8px">保存活动</button></div>
    </form>
    <button class="reset danger" id="resetBtn">↩ 恢复默认数据</button>
    <table>
      <thead><tr><th>活动</th><th>折扣</th><th>参与商品</th><th>叠加</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="pmBody"></tbody>
    </table>
  </div>
</div>

<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
